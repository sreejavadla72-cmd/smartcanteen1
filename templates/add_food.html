
{% extends "base.html" %}

{% block title %}Add Food Items | Smart Canteen{% endblock %}

{% block content %}

<h1>Add New Food Item 🍽️</h1>

<p class="page-description">
    Enter the food item details to add it to the canteen inventory.
</p>

<div class="form-card">

    <form method="POST" action="{{ url_for('add_food') }}">

        <label>Food Name</label>
        <input
            type="text"
            name="food_name"
            placeholder="Example: Samosa"
            maxlength="150"
            required
        >

        <label>Food Category</label>
        <select name="category" required>
            <option value="">Select Category</option>
            <option value="Snacks">Snacks</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Drinks">Drinks</option>
            <option value="Fast Food">Fast Food</option>
            <option value="Other">Other</option>
        </select>

        <label>Price (₹)</label>
        <input
            type="number"
            name="price"
            placeholder="Enter price"
            min="0.01"
            step="0.01"
            required
        >

        <label>Available Quantity</label>
        <input
            type="number"
            name="quantity"
            placeholder="Enter quantity"
            min="0"
            step="1"
            required
        >

        <label>Description</label>
        <textarea
            name="description"
            rows="4"
            placeholder="Enter food description"
        ></textarea>

        <button type="submit" class="primary-btn">
            Save Food Item
        </button>

        <a href="{{ url_for('food') }}" class="primary-btn">
            View Food Items
        </a>

    </form>

</div>

{% endblock %}
